<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="atlas-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2E"/>
      <stop offset="50%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <linearGradient id="atlas-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="atlas-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#atlas-bg)" stroke="#10B981" stroke-width="12" stroke-opacity="0.35"/>

  <!-- Subtle Inner Border -->
  <rect x="40" y="40" width="432" height="432" rx="92" fill="none" stroke="#34D399" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Geometric "A" with Cross-Border Payment Rail Chevron -->
  <!-- Left Leg of A -->
  <path d="M144 388 L232 124 C238 106 248 98 256 98 C264 98 274 106 280 124 L368 388 C374 406 364 418 344 418 C330 418 320 410 314 394 L290 320 L222 320 L198 394 C192 410 182 418 168 418 C148 418 138 406 144 388 Z" fill="url(#atlas-accent)" filter="url(#glow)"/>

  <!-- Inner Triangular Cutout of A -->
  <polygon points="256,182 232,274 280,274" fill="#042F2E"/>

  <!-- Horizontal Cross-Border Rail Wave / Chevron Fused Across A -->
  <path d="M112 284 L220 284 L256 242 L292 284 L400 284" stroke="url(#atlas-gold)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Core Settlement Node Pulse -->
  <circle cx="256" cy="242" r="14" fill="#FFFFFF"/>
</svg>

